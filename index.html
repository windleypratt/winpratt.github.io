<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Link Tiles</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <meta name="description" content="A modern link hub." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero" id="hero">
        <img id="avatar" src="images/profile.jpg" alt="Profile photo" class="avatar" />
        <div class="hero-text">
          <h1 id="name">Loading...</h1>
          <p id="location" class="location"></p>
          <p id="bio" class="bio"></p>
        </div>
        <a id="email-chip" href="mailto:" class="email-chip">Email</a>
      </section>

      <section id="tile-grid" class="tile-grid" aria-live="polite"></section>

      <footer class="footer">
        <p>
          <span>This link aggregator is open source and hosted with GitHub Pages.</span>
          <a href="https://github.com/windleypratt/winpratt.github.io" target="_blank" rel="noopener noreferrer">Learn more.</a>
        </p>
      </footer>
    </main>

    <noscript>
      <p class="noscript-msg">This page needs JavaScript enabled to load links from config.json.</p>
    </noscript>

    <script src="app.js" defer></script>
  </body>
</html>
